name: Setup Python scraper
description: Python 3.12, pip cache, Playwright chromium (cached)

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-drive.txt

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

    - name: Install Python dependencies
      shell: bash
      run: pip install -r requirements.txt

    - name: Install Playwright chromium
      shell: bash
      timeout-minutes: 5
      continue-on-error: true
      run: |
        set +e
        echo "Playwright: limit 5 min — po przekroczeniu idziemy dalej."
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
          timeout --kill-after=15 240 python -m playwright install-deps chromium
          if [ $? -ne 0 ]; then
            echo "::warning::playwright install-deps przekroczyl limit lub blad — kontynuuje bez systemowych deps."
          fi
          python -m playwright install chromium
        else
          timeout --kill-after=15 240 python -m playwright install chromium --with-deps
          if [ $? -ne 0 ]; then
            echo "::warning::playwright install --with-deps przekroczyl limit — proba bez deps."
            python -m playwright install chromium
          fi
        fi
        exit 0
