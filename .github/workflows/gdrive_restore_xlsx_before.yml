name: Restore Drive Excel before date

# Jednorazowe przywrocenie *_kontakte.xlsx na Google Drive do rewizji sprzed daty.
on:
  workflow_dispatch:
    inputs:
      before:
        description: "Przywroc wersje sprzed tej daty (YYYY-MM-DD, Europe/Warsaw)"
        required: true
        default: "2026-08-19"
        type: string
      dry_run:
        description: "Tylko wypisz rewizje, bez zapisu"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID_UA }}
  GDRIVE_VERSION_XLSX: "0"
  GDRIVE_APPEND_XLSX: "0"
  SCRAPER_TIMEZONE: Europe/Warsaw
  KANBUD_PROJECT_ROOT: ${{ github.workspace }}/libs

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-drive.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-drive.txt

      - name: Restore Excel on Google Drive
        env:
          GH_TOKEN: ${{ github.token }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_IMPERSONATE_EMAIL: ${{ secrets.GDRIVE_IMPERSONATE_EMAIL }}
          GDRIVE_SHARED_DRIVE_ID: ${{ secrets.GDRIVE_SHARED_DRIVE_ID }}
        run: |
          ARGS="--campaign ua --before ${{ github.event.inputs.before }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/gdrive_restore_xlsx_before.py $ARGS
