name: UA rebuild Excel all artifacts

# Scala WSZYSTKIE artefakty GitHub → JSON → Excel z walidacja i uzupelnieniem → Drive
on:
  workflow_dispatch:
    inputs:
      upload_drive:
        description: Wgraj na Google Drive po weryfikacji
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

concurrency:
  group: ua-pipeline
  cancel-in-progress: false

env:
  SCRAPER_TIMEZONE: Europe/Warsaw
  KANBUD_PROJECT_ROOT: ${{ github.workspace }}/libs
  GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID_UA }}
  GDRIVE_VERSION_XLSX: "0"
  GDRIVE_APPEND_XLSX: "0"
  GDRIVE_UPLOAD_CACHE: "1"
  UA_REGIONAL_INQUIRY_EMAIL_FROM: "2026-07-13"

jobs:
  rebuild-all:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-scraper

      - name: Install Google Drive dependencies
        run: pip install -r requirements-drive.txt

      - name: Download all UA pipeline artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _arts
          ALL=$(gh api "repos/${{ github.repository }}/actions/artifacts" \
            --paginate --jq '.artifacts[] | select(.expired==false)')
          echo "$ALL" | jq -s '
            [.[] | select(.name | startswith("ua-materialy-wyniki-"))]
            | unique_by(.id)
            | sort_by(.created_at)
            | .[]
            | {name, id, run: .workflow_run.id, size: .size_in_bytes}
          ' > /tmp/arts.json
          COUNT=$(jq -s 'length' /tmp/arts.json)
          echo "Artefaktow do pobrania: $COUNT"
          jq -c '.' /tmp/arts.json | while read -r row; do
            NAME=$(echo "$row" | jq -r '.name')
            RUN=$(echo "$row" | jq -r '.run')
            DEST="_arts/${NAME}-${RUN}"
            mkdir -p "$DEST"
            echo "Pobieram $NAME run=$RUN"
            gh run download "$RUN" -R "${{ github.repository }}" -n "$NAME" -D "$DEST" || true
          done

      - name: Rebuild Excel from all JSON + verify/fill loop
        run: |
          python scripts/rebuild_excel_from_all_artifacts.py --src _arts --wyniki Wyniki --wyslane wyslane

      - name: Upload Wyniki artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ua-materialy-wyniki-rebuild-all
          path: |
            Wyniki/
            wyslane/

      - name: Upload complete Excel to Google Drive
        if: success() && github.event.inputs.upload_drive != 'false'
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_IMPERSONATE_EMAIL: ${{ secrets.GDRIVE_IMPERSONATE_EMAIL }}
          GDRIVE_SHARED_DRIVE_ID: ${{ secrets.GDRIVE_SHARED_DRIVE_ID }}
        run: |
          python scripts/gdrive_upload_wyniki.py --campaign-dir . --campaign ua
